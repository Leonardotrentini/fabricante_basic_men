@font-face{

:root{

  --light:#D8D8D8; --white:#F5F5F5; --wa:#25D366; --wa-ink:#04160C;

}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--black); color:var(--white);
  font-family:system-ui,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.hero{
  min-height:100svh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:40px 20px calc(32px + env(safe-area-inset-bottom)); text-align:center; position:relative; overflow:hidden;
  background:
    radial-gradient(ellipse 80% 50% at 50% 0%, rgba(216,216,216,.10), transparent 70%),
    linear-gradient(var(--ring) 1px, transparent 1px) 0 0/44px 44px,
    linear-gradient(90deg, var(--ring) 1px, transparent 1px) 0 0/44px 44px,
    var(--black);
}
.hero::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(ellipse at center, transparent 30%, var(--black) 85%);
}
.wrap{position:relative; z-index:1; width:100%; max-width:440px; display:flex; flex-direction:column; align-items:center}

.logo{width:76px; height:116px; object-fit:cover; border-radius:8px; margin-bottom:28px; box-shadow:0 0 0 1px var(--ring)}

h1{
  font-family:Anton,Impact,"Arial Black",sans-serif; font-weight:400;
  font-size:clamp(38px,11vw,56px); line-height:.98; letter-spacing:-.01em; text-transform:uppercase;
  color:var(--white);
}
h1 .mark{
  display:inline-block; color:var(--black); background:var(--light);
  padding:0 .14em; margin:.06em 0; transform:skewX(-8deg);
}
h1 .mark span{display:inline-block; transform:skewX(8deg)}

.sub{margin-top:18px; font-size:16px; line-height:1.55; color:var(--muted); max-width:360px}
.sub b{color:var(--white); font-weight:700}

.ctas{width:100%; margin-top:32px; display:flex; flex-direction:column; gap:12px}
.btn{
  display:flex; align-items:center; gap:14px; width:100%; text-align:left;
  padding:16px 18px; border-radius:10px; text-decoration:none;
  transition:transform .15s ease, box-shadow .15s ease;
  -webkit-tap-highlight-color:transparent;
}
.btn:active{transform:scale(.98)}
.btn svg{flex:none; width:26px; height:26px}
.btn .txt{flex:1; display:flex; flex-direction:column; gap:3px}
.btn strong{font-size:14px; font-weight:800; letter-spacing:.1em; text-transform:uppercase}
.btn small{font-size:13px; opacity:.75}
.btn .arrow{flex:none; font-size:20px; font-weight:700}

.btn-wa{background:var(--wa); color:var(--wa-ink); box-shadow:0 8px 30px rgba(37,211,102,.28)}
.btn-vip{background:var(--black-2); color:var(--white); box-shadow:inset 0 0 0 1.5px var(--light)}
.btn-vip .tag{
  display:inline-block; font-size:10px; font-weight:800; letter-spacing:.12em;
  background:var(--light); color:var(--black); padding:2px 6px; border-radius:4px; margin-left:6px; vertical-align:2px;
}

@media (hover:hover){
  .btn-wa:hover{box-shadow:0 10px 40px rgba(37,211,102,.45)}
  .btn-vip:hover{box-shadow:inset 0 0 0 1.5px var(--white), 0 8px 30px rgba(216,216,216,.12)}
}
</style>
